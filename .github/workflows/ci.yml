name: CI

# Temporary: validates govengers/.github feat/test-cache before v1 moves. Not to be merged.
on:
  pull_request:

permissions:
  contents: read

jobs:
  scoped:
    uses: govengers/.github/.github/workflows/go-library.yml@feat/test-cache
    with:
      e2e: false
      badges: false
    permissions:
      contents: write
  full:
    uses: govengers/.github/.github/workflows/go-library.yml@feat/test-cache
    with:
      e2e: false
      badges: false
      full: true
    permissions:
      contents: write
